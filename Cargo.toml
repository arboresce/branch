[workspace]
members = [
    "core/domain",
    "core/runtime",
    "app/rust/runtime-ffi",
    "tools/bindgen"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uniffi = "=0.32.0"
branch-domain = { path = "core/domain" }
branch-runtime = { path = "core/runtime" }
