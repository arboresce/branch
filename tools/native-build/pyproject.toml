[project]
name = "branch-native-build"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema==4.26.0"]
[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"
[project.scripts]
branch-native = "branch_native_build.cli:main"
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]
[tool.ruff]
target-version = "py314"
line-length = 100
