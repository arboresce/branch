name: branch-checks

on:
  push:
  pull_request:

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.build/python

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Rust checks and tests
        run: make verify-rust

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: Python, contracts and native producer checks
        run: make check-tools

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: Android host checks and shared host tests
        run: |
          make setup-android
          make check-android
          make test-shared-android
      - name: Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: |
            ANDROID_BIN="$(command -v adb || echo "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/platform-tools/adb")"
            export ANDROID_SERIAL="$("${ANDROID_BIN}" devices | awk 'NR==2 {print $1}')"
            make test-android
            make test-catalog-android

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - uses: astral-sh/setup-uv@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: iOS setup and checks
        run: |
          make setup-ios
          make check-ios
      - name: Shared simulator tests
        run: make test-shared-ios
      - name: iOS host and catalog tests
        run: |
          make test-ios
          make test-catalog-ios
