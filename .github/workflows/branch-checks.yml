name: branch-checks

on:
  push:
  pull_request:

env:
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.build/python

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Rust checks and tests
        run: make verify-rust

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: Python, contracts and native producer checks
        run: make check-tools

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v5
      - name: Install Android SDK prerequisites
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmdline-tools;latest"
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: Android host checks and shared host tests
        run: |
          make setup-android
          make check-android
          make test-shared-android
      - name: Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: |
            adb wait-for-device
            devices="$(adb devices | awk 'NR>1 && $2 == "device" {print $1}')"
            count="$(printf '%s\n' "$devices" | grep -c .)"
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one ready emulator, found $count" >&2
              adb devices >&2
              exit 1
            fi
            export ANDROID_SERIAL="$devices"
            make test-android
            make test-catalog-android

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Preflight the configured iOS 26.5 runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 26.5"; then
            echo "The configured iOS 26.5 runtime is not installed" >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK prerequisites
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmdline-tools;latest"
      - uses: astral-sh/setup-uv@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare the selected Python environment
        run: uv sync --project tools/native-build --locked
      - name: iOS setup and checks
        run: |
          make setup-ios
          make check-ios
      - name: Shared simulator tests
        run: make test-shared-ios
      - name: iOS host and catalog tests
        run: |
          make test-ios
          make test-catalog-ios
